# Oxford Spires IMU noise densities and random walks ("x10" block).
#
# The Spires imu.yaml ships two sets: datasheet-level, and a commented-out x10
# block. These are that x10 block. The datasheet values are ~10x tighter than
# Aria/ScaRF (accel noise 0.0011 vs 0.0108) and freeze the accel bias, so the
# IMU factors look ~30 sigma while unwhitened residuals are actually better.

# Accelerometer
accelerometer_noise_density: 0.011002607647952406
accelerometer_random_walk: 3.390710627779767e-04

# Gyroscope
gyroscope_noise_density: 0.0022632861789099884
gyroscope_random_walk: 8.252445860125436e-05

rostopic: '/alphasense_driver_ros/imu'
update_rate: 400.0
